<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Intelligence v4.0 | Ultra-Sync</title>
    <style>
        :root {
            --primary: #3b82f6; --bg: #020617; --sidebar: #010409;
            --card: #0f172a; --border: #1e293b; --text: #f8fafc;
            --text-dim: #94a3b8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; color: var(--text-dim); border: 1px solid transparent; font-size: 1.2rem; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        /* --- MAIN --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px); }

        .view-section { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CONSOLA --- */
        .console-box { background: #000; border-radius: 12px; border: 1px solid var(--border); height: 78vh; padding: 20px; font-family: 'Consolas', monospace; font-size: 0.85rem; overflow-y: auto; color: #d8dee9; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .log-entry { margin-bottom: 8px; border-left: 3px solid var(--primary); padding-left: 12px; animation: flash 0.3s ease; }
        @keyframes flash { from { background: rgba(255,255,255,0.1); } to { background: transparent; } }

        /* --- UNIDADES --- */
        .grid-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .account-mini { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; position: relative; }
        .account-mini.working { border-color: var(--primary); animation: pulse 1s infinite; }
        .account-mini.error-shake { border-color: var(--danger); animation: shake 0.4s ease; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        /* --- AUDIO UI --- */
        .audio-ctrl { margin-top: auto; padding: 20px 0; border-top: 1px solid var(--border); width: 100%; text-align: center; }
        
        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<audio id="bg-music" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>
<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-fail" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3"></audio>
<audio id="snd-request" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="snd-alert" src="https://assets.mixkit.co/active_storage/sfx/1003/1003-preview.mp3"></audio>

<div id="lock">
    <div style="background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; width: 380px;">
        <h2 style="color:var(--primary)">Abraham Intelligence Hub</h2>
        <p style="font-size:0.8rem; color:var(--text-dim)">Protocolo de Sincronización v4.0</p>
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:14px; margin:20px 0; background:#000; border:1px solid var(--border); color:#fff; border-radius:10px; text-align:center;">
        <button onclick="unlock()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">INICIAR SESIÓN</button>
    </div>
</div>

<div class="sidebar">
    <div class="nav-item active" onclick="showView('console', this)">📜</div>
    <div class="nav-item" onclick="showView('accounts', this)">👥</div>
    <div class="nav-item" onclick="showView('database', this)">📁</div>
    
    <div class="audio-ctrl">
        <button id="mu-btn" onclick="toggleMusic()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🔇</button>
    </div>
</div>

<div class="main">
    <header>
        <div><span style="color:var(--text-dim)">KERNEL:</span> <span style="color:var(--primary)">v4.0.26_STABLE</span></div>
        <div style="font-weight:bold; letter-spacing:1px;">OPERADOR: PRO_ABRAHAM</div>
    </header>

    <div id="console" class="view-section active">
        <div class="console-box" id="log-container">
            <div class="log-entry" style="border-color:var(--success)">> [INIT] Motores de vibración y audio cargados.</div>
        </div>
    </div>

    <div id="accounts" class="view-section">
        <div class="grid-accounts" id="account-grid"></div>
    </div>

    <div id="database" class="view-section">
        <table style="width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden;">
            <thead style="background:rgba(255,255,255,0.05)">
                <tr>
                    <th style="padding:15px; text-align:left">USUARIO</th>
                    <th style="padding:15px; text-align:left">ESTADO</th>
                    <th style="padding:15px; text-align:left">ID_HASH</th>
                </tr>
            </thead>
            <tbody id="db-body"></tbody>
        </table>
    </div>
</div>

<script>
    const agentNames = ["Viper-1", "Shadow-2", "Ghost-3", "Alpha-4", "Raven-5", "Titan-6", "Omega-7", "Specter-8", "Phantom-9", "Neon-10", "Cobra-11", "Delta-12", "Frost-13", "Blade-14", "Rogue-15", "Ozone-16", "Sniper-17", "Vector-18", "Matrix-19", "Aero-20", "Zion-21", "Hunter-22", "Storm-23", "Proxy-24", "Echo-25", "Zenith-26"];
    
    // Pool de más de 60 usuarios únicos para evitar repeticiones
    const targetPool = ["Santi_Vlogs", "Dany_Garcia", "Vale.Luna", "Ximena_R", "Mateo_X", "Leo_Glez", "Cami.Star", "Fer_T", "Adrián_Net", "Sofía_Fit", "Diego.Dev", "Isa_King", "Nico_Z", "Valeria.J", "Seba_R", "Dani_S", "Gaby_H", "Andrés_Q", "Pau_L", "Juli_D", "Moni_V", "Elena.K", "Luis_Tech", "Carla_X", "Hugo_M", "Sara_N", "Kevin_G", "Rosa_L", "Beto_J", "Lara_W", "Iván_Z", "Clau_P", "Raúl_V", "Noelia_S", "Mario_K", "Tania_D", "Oscar_L", "Julia_Q", "Fabi_M", "Saúl_X", "Yadi_T", "Erick_B", "Gime_H", "Ángel_F", "Susi_R", "Polo_N", "Katia_S", "Mau_Pro", "Rorro_G", "Lili_D", "Fede_X", "Tete_M", "Javi_L", "Cata_S", "Gonza_Q", "Nati_P", "Santi_K", "Vero_V", "Paco_W", "Lety_Z"];

    let usedUsers = [];
    let isMusic = false;

    function unlock() {
        if(document.getElementById('pass').value === "abraham") {
            document.getElementById('lock').style.display = 'none';
            playSnd('snd-request');
            init();
        } else { vibrate(500); playSnd('snd-fail'); alert("PASSWORD INCORRECTO"); }
    }

    function toggleMusic() {
        const mu = document.getElementById('bg-music');
        if(!isMusic) { mu.play(); document.getElementById('mu-btn').innerText = '🎵'; }
        else { mu.pause(); document.getElementById('mu-btn').innerText = '🔇'; }
        isMusic = !isMusic;
    }

    function playSnd(id) {
        const s = document.getElementById(id);
        s.currentTime = 0;
        s.play().catch(() => {});
    }

    function vibrate(ms) {
        if ("vibrate" in navigator) navigator.vibrate(ms);
    }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    function init() {
        const grid = document.getElementById('account-grid');
        agentNames.forEach((name, i) => {
            grid.innerHTML += `
                <div class="account-mini" id="acc-${i}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="font-size:0.7rem;">${name}</b>
                        <span style="font-size:0.5rem; color:var(--success)">●</span>
                    </div>
                    <div id="task-${i}" style="font-size:0.55rem; color:var(--text-dim)">ESPERANDO...</div>
                </div>
            `;
        });
        startLoop();
    }

    function addLog(msg, type = 'info') {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        div.className = 'log-entry';
        let color = 'var(--primary)';
        
        if(type === 'success') { color = 'var(--success)'; playSnd('snd-success'); }
        if(type === 'warn') { color = 'var(--warning)'; playSnd('snd-alert'); vibrate(100); }
        if(type === 'error') { color = 'var(--danger)'; playSnd('snd-fail'); vibrate([200, 100, 200]); }

        div.style.borderColor = color;
        div.innerHTML = `<span style="color:${color}">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        container.prepend(div);
    }

    function startLoop() {
        setInterval(() => {
            if(usedUsers.length >= targetPool.length) usedUsers = []; // Reset si se acaban
            
            let user;
            do { user = targetPool[Math.floor(Math.random() * targetPool.length)]; } 
            while(usedUsers.includes(user));
            usedUsers.push(user);

            const id = Math.floor(Math.random() * 26);
            const unit = document.getElementById(`acc-${id}`);
            const chance = Math.random();

            unit.classList.add('working');
            document.getElementById(`task-${id}`).innerText = `PROCESANDO: @${user}`;

            setTimeout(() => {
                if(chance < 0.5) { // ÉXITO
                    addLog(`SYNC_OK: Archivos de <b style="color:white">@${user}</b> movidos a pro_abraham/media/`, 'success');
                    updateDB(user, 'VERIFICADO', 'success');
                } 
                else if(chance < 0.75) { // PRIVADO
                    addLog(`PRIVADO: <b style="color:white">@${user}</b> detectado. Solicitud enviada automáticamente.`, 'warn');
                    updateDB(user, 'PENDIENTE_REQ', 'warn');
                } 
                else if(chance < 0.9) { // FALLO DESCARGA
                    unit.classList.add('error-shake');
                    addLog(`FALLO: Error 403 en descarga de fotos de <b style="color:white">@${user}</b>.`, 'error');
                    updateDB(user, 'DOWNLOAD_ERR', 'error');
                    setTimeout(() => unit.classList.remove('error-shake'), 500);
                }
                else { // FALLO CONEXIÓN
                    unit.classList.add('error-shake');
                    addLog(`CRITICAL: Unidad ${agentNames[id]} perdió conexión con el nodo @${user}.`, 'error');
                    updateDB(user, 'TIMEOUT_ERR', 'error');
                    setTimeout(() => unit.classList.remove('error-shake'), 500);
                }
                unit.classList.remove('working');
                document.getElementById(`task-${id}`).innerText = `ESPERANDO...`;
            }, 3500);
        }, 4500);
    }

    function updateDB(user, status, type) {
        const body = document.getElementById('db-body');
        const row = document.createElement('tr');
        let color = type === 'error' ? 'var(--danger)' : (type === 'warn' ? 'var(--warning)' : 'var(--success)');
        row.innerHTML = `
            <td style="padding:12px; border-bottom:1px solid var(--border)">@${user}</td>
            <td style="padding:12px; border-bottom:1px solid var(--border); color:${color}">${status}</td>
            <td style="padding:12px; border-bottom:1px solid var(--border); font-size:0.7rem; color:var(--text-dim)">#${Math.random().toString(36).substr(2, 9).toUpperCase()}</td>
        `;
        body.prepend(row);
        if(body.children.length > 20) body.lastChild.remove();
    }
</script>
</body>
</html>
