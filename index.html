<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Intelligence Command | Multi-Sync</title>
    <style>
        :root {
            --primary: #3b82f6; --bg: #020617; --sidebar: #010409;
            --card: #0f172a; --border: #1e293b; --text: #f8fafc;
            --text-dim: #94a3b8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; color: var(--text-dim); border: 1px solid transparent; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        /* --- MAIN --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px); }

        .view-section { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- CONSOLA --- */
        .console-box { background: #000; border-radius: 12px; border: 1px solid var(--border); height: 75vh; padding: 20px; font-family: 'Consolas', monospace; font-size: 0.85rem; overflow-y: auto; color: #d8dee9; }
        .log-entry { margin-bottom: 8px; border-left: 3px solid var(--primary); padding-left: 12px; }

        /* --- CUENTAS (26 UNIDADES) --- */
        .grid-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .account-mini { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; position: relative; }
        .account-mini.working { border-color: var(--primary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        
        /* --- DATABASE --- */
        .db-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .db-table th, .db-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.8rem; }

        /* --- REPRODUCTOR MUSICA --- */
        .music-player { margin-top: auto; width: 100%; padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 5px; }

        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-error" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3"></audio>
<audio id="snd-start" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<div id="lock">
    <div style="background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; width: 380px;">
        <h2>Abraham OS v3.0</h2>
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:14px; margin-bottom:20px; background:#000; border:1px solid var(--border); color:#fff; border-radius:10px; text-align:center;">
        <button onclick="unlock()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">INICIALIZAR NÚCLEO</button>
    </div>
</div>

<div class="sidebar">
    <div class="nav-item active" onclick="showView('console', this)">📜</div>
    <div class="nav-item" onclick="showView('accounts', this)">👥</div>
    <div class="nav-item" onclick="showView('database', this)">📁</div>
    
    <div class="music-player">
        <button onclick="toggleMusic()" id="mu-btn" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🎵</button>
        <audio id="bg-music" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>
    </div>
</div>

<div class="main">
    <header>
        <h2 id="view-title" style="margin:0; font-size:1rem; color:var(--text-dim);">SYSTEM_LOG_REALTIME</h2>
        <div style="font-weight:bold; color:var(--primary);">ABRAHAM_ROOT_ACCESS</div>
    </header>

    <div id="console" class="view-section active">
        <div class="console-box" id="log-container">
            <div class="log-entry">> [SYSTEM] Audio Engine Ready...</div>
        </div>
    </div>

    <div id="accounts" class="view-section">
        <div class="grid-accounts" id="account-grid"></div>
    </div>

    <div id="database" class="view-section">
        <table class="db-table">
            <thead>
                <tr>
                    <th>USUARIO</th>
                    <th>RESULTADO</th>
                    <th>ARCHIVOS</th>
                    <th>TIMESTAMP</th>
                </tr>
            </thead>
            <tbody id="db-body"></tbody>
        </table>
    </div>
</div>

<script>
    const agentNames = ["Viper-1", "Shadow-2", "Ghost-3", "Alpha-4", "Raven-5", "Titan-6", "Omega-7", "Specter-8", "Phantom-9", "Neon-10", "Cobra-11", "Delta-12", "Frost-13", "Blade-14", "Rogue-15", "Ozone-16", "Sniper-17", "Vector-18", "Matrix-19", "Aero-20", "Zion-21", "Hunter-22", "Storm-23", "Proxy-24", "Echo-25", "Zenith-26"];
    
    const targetPool = ["Alexander_88", "Eduardo_Perez", "Santiago_Dev", "Valentina_Luna", "Mateo_Vlog", "Leonardo_C", "Ricardo_G", "Camila_X", "Rodrigo_Net", "Mauricio_Pro", "Ximena_12", "Adrian_M", "Sofia_Star", "Diego_King", "Isabella_W", "Nicolas_Z", "Valeria_Fit", "Sebastian_R", "Daniela_J", "Gabriel_H", "Camila_S", "Andres_Q", "Paula_L", "Julian_D", "Monica_V", "Elena_K", "Fernando_T"];

    let musicPlaying = false;

    function unlock() {
        if(document.getElementById('pass').value === "abraham") {
            document.getElementById('lock').style.display = 'none';
            playSnd('snd-start');
            init();
        } else { alert("Error"); }
    }

    function toggleMusic() {
        const m = document.getElementById('bg-music');
        if(!musicPlaying) { m.play(); document.getElementById('mu-btn').innerText = '⏸️'; } 
        else { m.pause(); document.getElementById('mu-btn').innerText = '🎵'; }
        musicPlaying = !musicPlaying;
    }

    function playSnd(id) {
        const s = document.getElementById(id);
        s.currentTime = 0;
        s.play().catch(e => console.log("Audio interact block"));
    }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    function init() {
        const grid = document.getElementById('account-grid');
        agentNames.forEach((name, i) => {
            grid.innerHTML += `
                <div class="account-mini" id="acc-${i}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="font-size:0.75rem;">${name}</b>
                        <span style="font-size:0.6rem; color:var(--success)">●</span>
                    </div>
                    <div id="task-${i}" style="font-size:0.6rem; color:var(--text-dim)">IDLE</div>
                </div>
            `;
        });
        startLoop();
    }

    function addLog(msg, type = 'info') {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        div.className = 'log-entry';
        let color = 'var(--primary)';
        if(type === 'error') { color = 'var(--danger)'; vibrate(); playSnd('snd-error'); }
        if(type === 'success') { color = 'var(--success)'; playSnd('snd-success'); }
        if(type === 'warn') color = 'var(--warning)';

        div.style.borderColor = color;
        div.innerHTML = `<span style="color:${color}">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        container.prepend(div);
    }

    function vibrate() {
        if ("vibrate" in navigator) { navigator.vibrate(200); }
    }

    function startLoop() {
        setInterval(() => {
            const id = Math.floor(Math.random() * 26);
            const user = targetPool[Math.floor(Math.random() * targetPool.length)];
            const unit = document.getElementById(`acc-${id}`);
            const chance = Math.random();

            unit.classList.add('working');
            document.getElementById(`task-${id}`).innerText = `EXTRAYENDO @${user.substring(0,8)}...`;

            setTimeout(() => {
                if(chance < 0.7) {
                    addLog(`ÉXITO: Datos de @${user} descargados y enviados a pro_abraham.`, 'success');
                    updateDB(user, 'COMPLETO', 'success');
                } else if(chance < 0.9) {
                    addLog(`PRIVADO: @${user} inaccesible. Enviando solicitud de seguimiento...`, 'warn');
                    updateDB(user, 'SOLICITUD', 'warn');
                } else {
                    addLog(`FALLO CRÍTICO: Error de red en unidad ${agentNames[id]} al procesar @${user}.`, 'error');
                    updateDB(user, 'FALLO', 'error');
                }
                unit.classList.remove('working');
                document.getElementById(`task-${id}`).innerText = `IDLE`;
            }, 3000);
        }, 4000);
    }

    function updateDB(user, res, type) {
        const body = document.getElementById('db-body');
        const row = document.createElement('tr');
        let color = type === 'error' ? 'var(--danger)' : (type === 'warn' ? 'var(--warning)' : 'var(--success)');
        row.innerHTML = `<td>@${user}</td><td style="color:${color}">${res}</td><td>${type === 'error' ? '---' : 'PHOTO_PACK.zip'}</td><td>${new Date().toLocaleTimeString()}</td>`;
        body.prepend(row);
    }
</script>
</body>
</html>
