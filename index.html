<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Intelligence Hub | v5.0 Supreme</title>
    <style>
        :root {
            --primary: #3b82f6; --bg: #020617; --sidebar: #010409;
            --card: #0f172a; --border: #1e293b; --text: #f8fafc;
            --text-dim: #94a3b8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; color: var(--text-dim); border: 1px solid transparent; font-size: 1.2rem; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        /* --- MAIN --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px); }

        .view-section { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI COMPONENTS --- */
        .console-box { background: #000; border-radius: 12px; border: 1px solid var(--border); height: 75vh; padding: 20px; font-family: 'Consolas', monospace; font-size: 0.85rem; overflow-y: auto; color: #d8dee9; }
        .log-entry { margin-bottom: 10px; border-left: 3px solid var(--primary); padding-left: 12px; line-height: 1.4; }
        
        .form-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 15px; max-width: 500px; margin: 0 auto; }
        input, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; margin-top: 10px; outline: none; }
        
        .grid-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .account-mini { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }

        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-fail" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3"></audio>
<audio id="snd-warn" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<div id="lock">
    <div style="background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; width: 350px;">
        <h2 style="color:var(--primary)">Abraham OS v5.0</h2>
        <input type="password" id="pass" placeholder="Acceso Root" style="text-align:center;">
        <button onclick="unlock()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; margin-top:20px; font-weight:bold; cursor:pointer;">INICIALIZAR</button>
    </div>
</div>

<div class="sidebar">
    <div class="nav-item active" onclick="showView('console', this)" title="Consola">📜</div>
    <div class="nav-item" onclick="showView('accounts', this)" title="Unidades">👥</div>
    <div class="nav-item" onclick="showView('database', this)" title="Registros">📁</div>
    <div class="nav-item" onclick="showView('playlist', this)" title="Playlist">🎶</div>
    <div class="nav-item" onclick="showView('suggest', this)" title="Sugerencias">✉️</div>
</div>

<div class="main">
    <header>
        <div style="font-size: 0.8rem; color: var(--text-dim)">UPLINK: <span style="color:var(--success)">ESTABLE</span></div>
        <div style="font-weight:bold; letter-spacing:1px;">ABRAHAM_ROOT</div>
    </header>

    <div id="console" class="view-section active">
        <div class="console-box" id="log-container">
            <div class="log-entry" style="border-color:var(--success)">> [SYSTEM] Protocolo v5.0 cargado.</div>
        </div>
    </div>

    <div id="accounts" class="view-section">
        <div class="grid-accounts" id="account-grid"></div>
    </div>

    <div id="database" class="view-section">
        <table style="width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden;">
            <tbody id="db-body"></tbody>
        </table>
    </div>

    <div id="playlist" class="view-section">
        <div style="text-align: center;">
            <h3>Reproductor Maestro</h3>
            <div id="yt-wrap" style="border-radius: 15px; overflow: hidden; display: inline-block; border: 1px solid var(--border);">
                <iframe id="yt-player" width="300" height="200" src="" frameborder="0" allow="autoplay"></iframe>
            </div>
            <p style="color:var(--text-dim); margin-top:15px;">Playlist: Cyber-Intrusion Mix</p>
        </div>
    </div>

    <div id="suggest" class="view-section">
        <div class="form-card">
            <h3 style="margin-top:0">Investigación Especial</h3>
            <p style="font-size:0.8rem; color:var(--text-dim)">¿Tienes un objetivo nuevo? Envía la cuenta aquí para que el creador investigue.</p>
            <label style="font-size:0.7rem;">@USUARIO O LINK</label>
            <input type="text" id="target-acc" placeholder="Ej: @usuario_ig">
            <label style="font-size:0.7rem; display:block; margin-top:15px;">MOTIVO / DETALLES</label>
            <textarea id="target-desc" rows="3" placeholder="Por qué investigar..."></textarea>
            <button onclick="sendSuggest()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; margin-top:20px; font-weight:bold; cursor:pointer;">ENVIAR A PROABRAHAM887</button>
        </div>
    </div>
</div>

<script>
    const agentNames = ["Viper-1", "Shadow-2", "Ghost-3", "Alpha-4", "Raven-5", "Titan-6", "Omega-7", "Specter-8", "Phantom-9", "Neon-10", "Cobra-11", "Delta-12", "Frost-13", "Blade-14", "Rogue-15", "Ozone-16", "Sniper-17", "Vector-18", "Matrix-19", "Aero-20", "Zion-21", "Hunter-22", "Storm-23", "Proxy-24", "Echo-25", "Zenith-26"];
    const targetPool = ["Santi_X", "Vale_Luna", "Xime_R", "Mateo_V", "Leo_G", "Cami_P", "Fer_T", "Adri_M", "Sofi_F", "Diego_D", "Isa_K", "Nico_S", "Vale_J", "Seba_B", "Dani_R", "Gaby_H", "Andres_Q", "Pau_Z", "Juli_D", "Moni_V", "Elena_K", "Luis_Tech", "Hugo_N", "Sara_X", "Kevin_G"];

    function unlock() {
        if(document.getElementById('pass').value === "abraham") {
            document.getElementById('lock').style.display = 'none';
            setupRandomMusic();
            init();
        } else { vibrate(500); playSnd('snd-fail'); alert("ERROR"); }
    }

    // ELIGIR CANCIÓN RANDOM DE LA PLAYLIST
    function setupRandomMusic() {
        const randomIndex = Math.floor(Math.random() * 50); // Simula elegir un video de la lista
        const playlistId = "PLVHteamDfSjaoHF5ysXONI04wjsyy-g81";
        const player = document.getElementById('yt-player');
        player.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=${randomIndex}&autoplay=1`;
    }

    function sendSuggest() {
        const user = document.getElementById('target-acc').value;
        if(user) {
            alert("Sugerencia enviada a proabraham887@gmail.com");
            document.getElementById('target-acc').value = "";
            document.getElementById('target-desc').value = "";
        }
    }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    function playSnd(id) {
        const s = document.getElementById(id);
        s.pause(); s.currentTime = 0; s.play().catch(()=>{});
    }

    function vibrate(ms) { if ("vibrate" in navigator) navigator.vibrate(ms); }

    function init() {
        const grid = document.getElementById('account-grid');
        agentNames.forEach((name, i) => {
            grid.innerHTML += `
                <div class="account-mini" id="acc-${i}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="font-size:0.7rem;">${name}</b>
                        <span style="font-size:0.5rem; color:var(--success)">●</span>
                    </div>
                    <div id="task-${i}" style="font-size:0.55rem; color:var(--text-dim)">IDLE</div>
                </div>
            `;
        });
        startLoop();
    }

    function addLog(msg, type = 'info') {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        div.className = 'log-entry';
        if(type === 'success') { playSnd('snd-success'); div.style.borderColor = 'var(--success)'; }
        if(type === 'warn') { playSnd('snd-warn'); div.style.borderColor = 'var(--warning)'; vibrate(80); }
        if(type === 'error') { playSnd('snd-fail'); div.style.borderColor = 'var(--danger)'; vibrate([100, 50, 100]); }
        div.innerHTML = `<span style="color:var(--text-dim)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        container.prepend(div);
    }

    function startLoop() {
        setInterval(() => {
            let user = targetPool[Math.floor(Math.random() * targetPool.length)];
            const id = Math.floor(Math.random() * 2 agentNames.length);
            const unit = document.getElementById(`acc-${id}`);
            if(!unit) return;
            const chance = Math.random();

            unit.classList.add('working');
            document.getElementById(`task-${id}`).innerText = `PROCESANDO...`;

            setTimeout(() => {
                if(chance < 0.6) {
                    addLog(`EXITO: <b style="color:white">@${user}</b> sincronizado. Enviando a base de datos... haciendo copia de seguridad.`, 'success');
                    updateDB(user, 'VERIFICADO');
                } else if(chance < 0.85) {
                    addLog(`PRIVADO: <b style="color:white">@${user}</b>. Enviando solicitud desde la cuenta <b style="color:var(--primary)">pro_abraham</b>...`, 'warn');
                    updateDB(user, 'SOLICITUD');
                } else {
                    addLog(`FALLO: Error de enlace en nodo <b style="color:white">@${user}</b>. Reintentando...`, 'error');
                }
                unit.classList.remove('working');
                document.getElementById(`task-${id}`).innerText = `IDLE`;
            }, 3000);
        }, 4500);
    }

    function updateDB(user, status) {
        const body = document.getElementById('db-body');
        const row = document.createElement('tr');
        row.innerHTML = `<td style="padding:10px; border-bottom:1px solid var(--border)">@${user}</td><td style="padding:10px; border-bottom:1px solid var(--border); font-size:0.7rem; opacity:0.6;">${status}</td>`;
        body.prepend(row);
    }
</script>
</body>
</html>
