<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Intelligence Hub | v4.2 Fix</title>
    <style>
        :root {
            --primary: #3b82f6; --bg: #020617; --sidebar: #010409;
            --card: #0f172a; --border: #1e293b; --text: #f8fafc;
            --text-dim: #94a3b8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 80px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; color: var(--text-dim); border: 1px solid transparent; font-size: 1.2rem; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        .main { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px); }

        .view-section { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .console-box { background: #000; border-radius: 12px; border: 1px solid var(--border); height: 78vh; padding: 20px; font-family: 'Consolas', monospace; font-size: 0.85rem; overflow-y: auto; color: #d8dee9; }
        .log-entry { margin-bottom: 8px; border-left: 3px solid var(--primary); padding-left: 12px; }

        .grid-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .account-mini { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .account-mini.working { border-color: var(--primary); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .audio-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-top: auto; }
    </style>
</head>
<body>

<audio id="bg-music" loop src="https://codeskulptor-demos.commondatastorage.googleapis.com/descent/background%20music.mp3"></audio>
<audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-fail" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3"></audio>
<audio id="snd-warn" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<div id="lock">
    <div style="background: var(--card); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; width: 350px;">
        <h2 style="color:var(--primary)">Abraham Intelligence</h2>
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:14px; margin:20px 0; background:#000; border:1px solid var(--border); color:#fff; border-radius:10px; text-align:center;">
        <button onclick="unlock()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">DECRYPT & ENTER</button>
    </div>
</div>

<div class="sidebar">
    <div class="nav-item active" onclick="showView('console', this)">📜</div>
    <div class="nav-item" onclick="showView('accounts', this)">👥</div>
    <div class="nav-item" onclick="showView('database', this)">📁</div>
    <button id="mu-btn" class="audio-btn" onclick="toggleMusic()">🔇</button>
</div>

<div class="main">
    <header>
        <div style="font-size: 0.8rem; color: var(--text-dim)">UPLINK_STATUS: <span style="color:var(--success)">ENCRYPTED</span></div>
        <div style="font-weight:bold;">OPERADOR_ABRAHAM</div>
    </header>

    <div id="console" class="view-section active">
        <div class="console-box" id="log-container">
            <div class="log-entry">> [SYSTEM] Núcleo cargado. Esperando interacción...</div>
        </div>
    </div>

    <div id="accounts" class="view-section">
        <div class="grid-accounts" id="account-grid"></div>
    </div>

    <div id="database" class="view-section">
        <table style="width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden;">
            <tbody id="db-body"></tbody>
        </table>
    </div>
</div>

<script>
    const agentNames = ["Viper-1", "Shadow-2", "Ghost-3", "Alpha-4", "Raven-5", "Titan-6", "Omega-7", "Specter-8", "Phantom-9", "Neon-10", "Cobra-11", "Delta-12", "Frost-13", "Blade-14", "Rogue-15", "Ozone-16", "Sniper-17", "Vector-18", "Matrix-19", "Aero-20", "Zion-21", "Hunter-22", "Storm-23", "Proxy-24", "Echo-25", "Zenith-26"];
    
    const targetPool = ["Santi_X", "Vale_Luna", "Xime_R", "Mateo_V", "Leo_G", "Cami_P", "Fer_T", "Adri_M", "Sofi_F", "Diego_D", "Isa_K", "Nico_S", "Vale_J", "Seba_B", "Dani_R", "Gaby_H", "Andres_Q", "Pau_Z", "Juli_D", "Moni_V", "Elena_K", "Luis_Tech", "Hugo_N", "Sara_X", "Kevin_G", "Beto_M", "Lara_P", "Ivan_V", "Clau_S", "Raul_B", "Noelia_X", "Mario_Q", "Tania_F", "Oscar_Z", "Julia_H", "Angel_D", "Mau_Pro", "Rorro_S", "Lili_V", "Javi_P"];

    let usedUsers = [];
    let isMusic = false;

    function unlock() {
        if(document.getElementById('pass').value === "abraham") {
            document.getElementById('lock').style.display = 'none';
            // Iniciamos música automáticamente al entrar si es posible
            toggleMusic(); 
            init();
        } else { vibrate(500); playSnd('snd-fail'); alert("ERROR"); }
    }

    function toggleMusic() {
        const mu = document.getElementById('bg-music');
        if(!isMusic) {
            mu.volume = 0.3;
            mu.play().catch(() => console.log("User must click first"));
            document.getElementById('mu-btn').innerText = '🎵';
            isMusic = true;
        } else {
            mu.pause();
            document.getElementById('mu-btn').innerText = '🔇';
            isMusic = false;
        }
    }

    // FUNCIÓN CORREGIDA PARA SONIDOS CORTOS
    function playSnd(id) {
        const s = document.getElementById(id);
        s.pause();          // Detiene cualquier reproducción previa
        s.currentTime = 0;  // Reinicia al segundo 0
        s.play().catch(() => {});
    }

    function vibrate(ms) {
        if ("vibrate" in navigator) navigator.vibrate(ms);
    }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
    }

    function init() {
        const grid = document.getElementById('account-grid');
        agentNames.forEach((name, i) => {
            grid.innerHTML += `
                <div class="account-mini" id="acc-${i}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="font-size:0.7rem;">${name}</b>
                        <span style="font-size:0.5rem; color:var(--success)">●</span>
                    </div>
                    <div id="task-${i}" style="font-size:0.55rem; color:var(--text-dim)">STANDBY</div>
                </div>
            `;
        });
        startLoop();
    }

    function addLog(msg, type = 'info') {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        div.className = 'log-entry';
        
        if(type === 'success') { playSnd('snd-success'); div.style.borderColor = 'var(--success)'; }
        if(type === 'warn') { playSnd('snd-warn'); div.style.borderColor = 'var(--warning)'; vibrate(100); }
        if(type === 'error') { playSnd('snd-fail'); div.style.borderColor = 'var(--danger)'; vibrate([200, 100, 200]); }

        div.innerHTML = `<span style="color:var(--text-dim)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        container.prepend(div);
        if(container.children.length > 50) container.lastChild.remove();
    }

    function startLoop() {
        setInterval(() => {
            let user = targetPool[Math.floor(Math.random() * targetPool.length)];
            const id = Math.floor(Math.random() * 26);
            const unit = document.getElementById(`acc-${id}`);
            const chance = Math.random();

            unit.classList.add('working');
            document.getElementById(`task-${id}`).innerText = `SCANNING: @${user}`;

            setTimeout(() => {
                if(chance < 0.6) {
                    addLog(`SUCCESS: Data from <b style="color:white">@${user}</b> synced.`, 'success');
                    updateDB(user, 'COMPLETED');
                } else if(chance < 0.85) {
                    addLog(`PRIVATE: <b style="color:white">@${user}</b> detected. Request sent.`, 'warn');
                    updateDB(user, 'REQ_SENT');
                } else {
                    addLog(`CRITICAL: Node ${agentNames[id]} failed to reach @${user}.`, 'error');
                    updateDB(user, 'FAILED');
                }
                unit.classList.remove('working');
                document.getElementById(`task-${id}`).innerText = `STANDBY`;
            }, 3000);
        }, 4000);
    }

    function updateDB(user, status) {
        const body = document.getElementById('db-body');
        const row = document.createElement('tr');
        row.innerHTML = `<td style="padding:10px; border-bottom:1px solid var(--border)">@${user}</td><td style="padding:10px; border-bottom:1px solid var(--border)">${status}</td>`;
        body.prepend(row);
    }
</script>
</body>
</html>
