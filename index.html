<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Intelligence Hub | Abraham</title>
    <style>
        :root {
            --primary: #3b82f6; --bg: #020617; --sidebar: #010409;
            --card: #0f172a; --border: #1e293b; --text: #f8fafc;
            --text-dim: #94a3b8; --success: #10b981; --warning: #f59e0b;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- BARRA LATERAL (MENÚ) --- */
        .sidebar { width: 80px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; color: var(--text-dim); border: 1px solid transparent; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(8px); }

        .view-section { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PESTAÑA 1: CONSOLA --- */
        .console-box { background: #000; border-radius: 12px; border: 1px solid var(--border); height: 80vh; padding: 20px; font-family: 'SFMono-Regular', monospace; font-size: 0.8rem; overflow-y: auto; color: #88c0d0; }
        .log-entry { margin-bottom: 8px; border-left: 2px solid var(--primary); padding-left: 10px; }

        /* --- PESTAÑA 2: CUENTAS (26 UNIDADES) --- */
        .grid-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .account-mini { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
        .acc-header { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 10px; }
        .status-tag { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .status-active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-suspended { background: rgba(245, 158, 11, 0.1); color: var(--warning); }

        /* --- PESTAÑA 3: DATABASE --- */
        .db-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .db-table th, .db-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .db-table th { background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; }
        .link-placeholder { color: var(--primary); text-decoration: underline; cursor: pointer; }

        /* --- PANTALLA BLOQUEO --- */
        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="lock">
    <div style="background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 350px;">
        <h2 style="margin:0 0 20px 0">Abraham OS</h2>
        <input type="password" id="pass" placeholder="Password" style="width:100%; padding:12px; margin-bottom:20px; background:#000; border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center;">
        <button onclick="unlock()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">ACCEDER</button>
    </div>
</div>

<div class="sidebar">
    <div style="width:40px; height:40px; background:var(--primary); border-radius:8px; margin-bottom:40px;"></div>
    <div class="nav-item active" onclick="showView('console', this)" title="Consola de Registros">📜</div>
    <div class="nav-item" onclick="showView('accounts', this)" title="Cuentas Activas">👥</div>
    <div class="nav-item" onclick="showView('database', this)" title="Base de Datos">📁</div>
</div>

<div class="main">
    <header>
        <h2 id="view-title" style="margin:0; font-size:1.2rem;">Consola de Registros</h2>
        <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-size:0.75rem; color:var(--success)">● SYSTEM ONLINE</span>
            <span style="font-weight:bold; border-left:1px solid var(--border); padding-left:15px;">Abraham Root</span>
        </div>
    </header>

    <div id="console" class="view-section active">
        <div class="console-box" id="log-container">
            <div class="log-entry">> [SYSTEM] Núcleo cargado exitosamente.</div>
            <div class="log-entry">> [LINK] Conexión establecida con pro_abraham.</div>
        </div>
    </div>

    <div id="accounts" class="view-section">
        <div class="grid-accounts" id="account-grid"></div>
    </div>

    <div id="database" class="view-section">
        <table class="db-table">
            <thead>
                <tr>
                    <th>Usuario Instagram</th>
                    <th>Estado</th>
                    <th>Fotos/Archivos</th>
                    <th>Registro ID</th>
                </tr>
            </thead>
            <tbody id="db-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const targets = ["Alexander", "Eduardo", "Santiago", "Valentina", "Mateo", "Leonardo", "Ricardo", "Camila", "Rodrigo", "Mauricio"];
    
    function unlock() {
        if(document.getElementById('pass').value === "abraham") {
            document.getElementById('lock').style.display = 'none';
            init();
        } else { alert("Acceso denegado"); }
    }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
        
        const titles = { 'console': 'Consola de Registros', 'accounts': 'Gestión de Cuentas (26 Unidades)', 'database': 'Base de Datos de Usuarios' };
        document.getElementById('view-title').innerText = titles[viewId];
    }

    function init() {
        // Generar 26 Cuentas
        const grid = document.getElementById('account-grid');
        for(let i=1; i<=26; i++) {
            const status = i % 5 === 0 ? 'SUSPENSIÓN' : 'ACTIVA';
            const statusClass = i % 5 === 0 ? 'status-suspended' : 'status-active';
            grid.innerHTML += `
                <div class="account-mini">
                    <div class="acc-header">
                        <b>Unidad_${i.toString().padStart(2,'0')}</b>
                        <span class="status-tag ${statusClass}">${status}</span>
                    </div>
                    <div style="font-size:0.65rem; color:var(--text-dim);">
                        Ping: ${Math.floor(Math.random()*20)+10}ms<br>
                        Uptime: ${(Math.random()*24).toFixed(1)}h
                    </div>
                </div>
            `;
        }
        startSimulation();
    }

    function addLog(msg) {
        const container = document.getElementById('log-container');
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span style="color:var(--primary)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        container.prepend(div);
        if(container.children.length > 40) container.lastChild.remove();
    }

    function addToDB(user) {
        const body = document.getElementById('db-body');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><b>@${user}</b></td>
            <td style="color:var(--success)">Sincronizado</td>
            <td><span class="link-placeholder">Ver_Media_${Math.floor(Math.random()*999)}.jpg</span></td>
            <td style="font-family:monospace; color:var(--text-dim)">#ID-${Math.floor(Math.random()*100000)}</td>
        `;
        body.prepend(row);
        if(body.children.length > 15) body.lastChild.remove();
    }

    function startSimulation() {
        setInterval(() => {
            const user = targets[Math.floor(Math.random()*targets.length)] + "_" + Math.floor(Math.random()*99);
            addLog(`Extracción iniciada en <b style="color:white">@${user}</b>. Enviando a pro_abraham...`);
            
            setTimeout(() => {
                addLog(`Sincronización completa: <b style="color:var(--success)">@${user}</b> almacenado en base de datos.`);
                addToDB(user);
            }, 3000);
        }, 5000);
    }
</script>

</body>
</html>
